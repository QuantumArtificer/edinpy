name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest

  numba:
    name: Optional Numba backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with Numba
        run: python -m pip install -e ".[test,numba]"
      - name: Test optional execution backends
        run: python -m pytest

  quality:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8"
      - name: Check
        run: python -m ruff check src tests examples benchmarks docs/scripts

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install "build>=1.2" "twine>=5"
      - name: Build
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Import installed package
        working-directory: /tmp
        run: python -c "import edinpy; print(edinpy.__version__)"
      - name: Run examples
        run: |
          for example in examples/fermion/*.py examples/boson/*.py; do
            python "$example"
          done
      - name: Smoke-test benchmark CLI
        run: >-
          python benchmarks/profile_fermion_execution.py
          --modes 8 --particles 4
          --families hopping diagonal
          --executions numpy
          --repeat 1
          --json benchmark-results-ci.json
