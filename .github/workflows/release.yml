name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Validate and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release dependencies
        run: python -m pip install -e ".[test,docs,dev,numba]"

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          from edinpy import __version__

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"release tag must start with 'v': {tag}")

          version = tag[1:]
          if __version__ != version:
              raise SystemExit(
                  f"tag/package version mismatch: {tag} != {__version__}"
              )

          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version:\s*['\"]?([^'\"\s]+)", citation)
          if match is None:
              raise SystemExit("CITATION.cff has no version field")
          if match.group(1) != version:
              raise SystemExit(
                  "tag/CITATION.cff version mismatch: "
                  f"{tag} != {match.group(1)}"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if f"## [{version}]" not in changelog:
              raise SystemExit(
                  f"CHANGELOG.md has no release heading for {version}"
              )

          print(f"release metadata verified for {tag}")
          PY

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: python -m ruff check src tests examples benchmarks docs/scripts

      - name: Run examples
        run: |
          for example in examples/fermion/*.py examples/boson/*.py; do
            echo "==> $example"
            python "$example"
          done

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        run: |
          rm -rf /tmp/edinpy-release-wheel
          python -m pip install \
            --no-deps \
            --target /tmp/edinpy-release-wheel \
            dist/*.whl

          cd /tmp
          PYTHONPATH=/tmp/edinpy-release-wheel python - <<'PY'
          import edinpy
          import edinpy.boson
          import edinpy.fermion

          print("version:", edinpy.__version__)
          print("package:", edinpy.__file__)
          print("boson:", edinpy.boson.__file__)
          print("fermion:", edinpy.fermion.__file__)
          PY

      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/edinpy/
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Publish GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download published distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Write checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* SHA256SUMS \
            --verify-tag \
            --title "EDinPy ${GITHUB_REF_NAME#v}" \
            --generate-notes
