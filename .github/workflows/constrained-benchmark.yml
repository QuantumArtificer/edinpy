name: Constrained Numba benchmark

on:
  push:
    branches:
      - perf/constrained-numba-phase-a

permissions:
  contents: read

jobs:
  benchmark:
    name: 24-mode constrained matvec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[numba]"
      - name: Run constrained benchmark
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --repeat 2 \
            --json constrained_direct_lookup.json
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: constrained-direct-lookup
          path: benchmarks/results/constrained_direct_lookup.json
