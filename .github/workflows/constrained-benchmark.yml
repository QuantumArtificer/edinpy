name: Constrained Numba benchmark

on:
  push:
    branches:
      - perf/constrained-numba-phase-a

permissions:
  contents: read

jobs:
  benchmark:
    name: 24-mode constrained matvec
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[numba]"
      - name: Run isolated Numba benchmark
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --repeat 3 \
            --json constrained_direct_numba.json
      - name: Run isolated NumPy benchmark
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numpy \
            --repeat 3 \
            --json constrained_direct_numpy.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: constrained-direct-isolated
          path: |
            benchmarks/results/constrained_direct_numba.json
            benchmarks/results/constrained_direct_numpy.json
