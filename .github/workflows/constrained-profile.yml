name: Constrained kernel profile

on:
  push:
    branches:
      - perf/constrained-numba-phase-a

permissions:
  contents: read

jobs:
  benchmark:
    name: 24-mode kernel families
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[numba]"
      - name: Diagonal workload
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --number-terms 156 \
            --hopping-groups 0 \
            --quartic-processes 0 \
            --repeat 2 \
            --json constrained_diagonal.json
      - name: Hopping workload
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --number-terms 0 \
            --hopping-groups 72 \
            --quartic-processes 0 \
            --repeat 2 \
            --json constrained_hopping.json
      - name: Quartic workload
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --number-terms 0 \
            --hopping-groups 0 \
            --quartic-processes 288 \
            --repeat 2 \
            --json constrained_quartic.json
      - name: Mixed workload
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --repeat 2 \
            --json constrained_mixed.json
      - name: Upload profile results
        uses: actions/upload-artifact@v4
        with:
          name: constrained-kernel-profile
          path: benchmarks/results/constrained_*.json
