name: Factorized constrained benchmark

on:
  push:
    branches:
      - perf/constrained-numba-phase-a

permissions:
  contents: read

jobs:
  benchmark:
    name: factorized versus binary projected ranking
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[numba]"
      - name: Blocked populations hopping
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --number-terms 0 \
            --hopping-groups 72 \
            --quartic-processes 0 \
            --repeat 2 \
            --json factorized_hopping.json
      - name: Interleaved populations hopping
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --interleaved-populations \
            --number-terms 0 \
            --hopping-groups 72 \
            --quartic-processes 0 \
            --repeat 2 \
            --json binary_hopping.json
      - name: Blocked populations mixed
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --repeat 2 \
            --json factorized_mixed.json
      - name: Interleaved populations mixed
        run: |
          python benchmarks/profile_constrained_fermion_execution.py \
            --executions numba-serial \
            --interleaved-populations \
            --repeat 2 \
            --json binary_mixed.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: factorized-constrained-ranking
          path: benchmarks/results/*.json
