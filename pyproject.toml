[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edinpy"
version = "0.3.0.dev0"
description = "Exact diagonalization for finite quantum many-body systems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Alex Santacruz"},
]
keywords = [
  "exact diagonalization",
  "many-body physics",
  "fermions",
  "quantum lattice models",
  "scientific computing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]
docs = [
  "sphinx>=7",
  "myst-parser>=2",
  "pydata-sphinx-theme>=0.15",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
  "matplotlib==3.10.8",
]
dev = [
  "build>=1.2",
  "twine>=5",
  "ruff>=0.8",
]

[project.urls]
Documentation = "https://quantumartificer.github.io/edinpy/"
Repository = "https://github.com/QuantumArtificer/edinpy"
Issues = "https://github.com/QuantumArtificer/edinpy/issues"
Changelog = "https://github.com/QuantumArtificer/edinpy/blob/main/CHANGELOG.md"
Contributing = "https://quantumartificer.github.io/edinpy/development/contributing.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["docs/source/_static"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
